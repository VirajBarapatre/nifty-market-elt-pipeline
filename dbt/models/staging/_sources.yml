version: 2

sources:
  - name: raw
    description: "Untouched prices loaded by the Python ingestion (ingestion/load.py)."
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'raw') }}"
    tables:
      - name: daily_prices
        description: "One row per ticker per trading day from yfinance, upserted on (ticker, trade_date)."
        config:
          loaded_at_field: ingested_at
          # Markets close on weekends and holidays, so 1 day would warn every Monday.
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 5, period: day}
